services:
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes: ["./backend:/srv"]
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_started}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-true}
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]
