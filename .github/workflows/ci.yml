name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build   # type-checks (tsc) and bundles

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production compose file is valid and requires its secrets
        run: |
          if docker compose -f docker-compose.prod.yml config >/dev/null 2>&1; then echo "expected failure without secrets"; exit 1; fi
          DATABASE_URL=postgresql://postgres:placeholder@db.example.test:5432/postgres SECRET_KEY=y PUBLIC_URL=https://fleet.example.com docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Images build
        run: |
          docker build -f backend/Dockerfile.prod backend -t fleetmind-backend:ci
          docker build -f frontend/Dockerfile.prod frontend -t fleetmind-web:ci
